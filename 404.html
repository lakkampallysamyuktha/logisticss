<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Logistics</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/404.css">
</head>
<body>
    <div class="page-404-wrapper">
        <!-- Background floating elements -->
        <div class="floating-element el-1"></div>
        <div class="floating-element el-2"></div>

        <div class="content-404">
            <h1 class="title-404">404</h1>
            <h2 class="subtitle-404">Oops! Route Not Found</h2>
            <p class="desc-404">The page you are looking for seems to have gone off the map. Let's get you back on track.</p>
            
            <div class="actions-404">
                <button onclick="history.back()" class="btn">Go Back</button>
                <a href="index.html" class="btn btn-solid">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
